# toggle statusbar
bind-key b set-option status

# Change prefix
unbind C-b
set -g prefix `
bind ` send-prefix

set -g mouse on
set -sg terminal-overrides ",*:RGB"  # true color support

set-option -g status-position top
# set-option -g status off

# set term panel title
set-option -g set-titles on
set-option -g set-titles-string "#S"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'catpuccin/tmux'

# Theme: borders
set -g pane-border-lines simple
set -g pane-border-style fg=black,bright
set -g pane-active-border-style fg=magenta

# Theme: status
set -g status-style bg=default,fg=black,bright
set -g status-left ""
set -g status-right "#[fg=black,bright]#S"

# Theme: status (windows)
set -g window-status-format " ●"
set -g window-status-current-format " ●"

set -g window-status-current-style "#{?window_zoomed_flag,fg=yellow,fg=magenta,nobold}"
set -g window-status-bell-style "fg=red,nobold"

# Keybindings: split
bind | split-window -h
bind - split-window -v

# Keybindings: for select-pane
bind Up select-pane -U
bind Left select-pane -L
bind Down select-pane -D
bind Right select-pane -R
bind k select-pane -U
bind h select-pane -L
bind j select-pane -D
bind l select-pane -R

# Keybindings: other
bind z resize-pane -Z
bind-key x kill-pane
bind-key o "select-pane -t :.+ ; resize-pane -Z"


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
